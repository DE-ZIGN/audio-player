<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:5173" />
    <title>AudioPlayer</title>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>AudioPlayer <span class="tag">仮称</span></h1>
        <span id="backend-kind" class="backend-kind"></span>
      </header>

      <section class="panel file">
        <button id="open" type="button">ファイルを開く</button>
        <div class="file-name" id="file-name">ファイルを開いてください</div>
      </section>

      <section class="panel transport">
        <div class="buttons">
          <button id="play" type="button" class="primary" disabled>再生</button>
          <button id="stop" type="button" disabled>停止</button>
          <span class="state" id="state"></span>
        </div>
        <div class="seek">
          <span class="time" id="position">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" step="1" disabled aria-label="再生位置" />
          <span class="time" id="duration">0:00</span>
        </div>
      </section>

      <section class="panel path">
        <h2>経路</h2>
        <dl>
          <dt>入力</dt>
          <dd id="source-format">—</dd>
          <dt>出力デバイス</dt>
          <dd id="output-name">—</dd>
          <dt>送る形式</dt>
          <dd id="output-format">—</dd>
          <dt>詰め替え</dt>
          <dd id="repack">—</dd>
          <dt>処理</dt>
          <dd>なし（原音経路：音量・変換・ディザをかけません）</dd>
        </dl>
        <p class="error" id="error" hidden></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
